<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整夜睡眠音樂</title>
<meta name="description" content="在瀏覽器裡即時生成的睡眠音樂，可整夜播放：海浪、細雨、溫柔和弦與遠方鈴聲。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b5452b">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="再站起來">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 夜間頁面：淺色與深色模式都使用低亮度配色，避免睡前刺眼 */
  :root {
    --bg: #0f1420;
    --surface: #161d2c;
    --ink: #d9dde6;
    --muted: #8b94a7;
    --line: #253049;
    --accent: #8fb3e8;
    --glow: rgba(143, 179, 232, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0f18; --surface: #121826; }
  }
  :root[data-theme="dark"] { --bg: #0b0f18; --surface: #121826; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px 60px; text-align: center; }
  a.back { color: var(--muted); font-size: .9rem; text-decoration: none; }
  a.back:hover { color: var(--accent); }
  h1 { font-family: "Noto Serif TC", serif; font-size: clamp(1.7rem, 6vw, 2.4rem); margin: 18px 0 6px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .orb-wrap { display: grid; place-items: center; height: 240px; }
  .orb {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--accent), transparent 70%);
    box-shadow: 0 0 80px 20px var(--glow);
    opacity: .5;
    transform: scale(.9);
    transition: transform 3s ease-in-out, opacity 3s ease-in-out;
  }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 26px 0 0; }
  .presets button { padding: 6px 14px; font-size: .92rem; }
  .presets button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .mixer h2 { font-size: .95rem; font-weight: 500; color: var(--ink); margin: 14px 0 4px; }
  .mixer h2:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: .9rem; min-height: 1.7em; }
  .time { font-size: 2.6rem; font-variant-numeric: tabular-nums; letter-spacing: .04em; margin: 8px 0 20px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, select {
    font: inherit;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 22px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #0b0f18; border-color: var(--accent); font-weight: 500; }
  button:disabled, select:disabled { opacity: .45; cursor: default; }
  .mixer {
    margin: 34px 0 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    text-align: left;
  }
  .mixer label { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; gap: 12px; margin: 8px 0; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .note { color: var(--muted); font-size: .85rem; margin-top: 28px; text-align: left; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <a class="back" href="./">← 回到「考績之後，再站起來」</a>
  <h1>今晚，先好好睡一覺</h1>
  <p class="sub">海浪、雨聲、營火、森林、溫柔的和弦與遠方的鈴聲。<br>每一次播放都是即時生成，不會完全重複。</p>

  <div class="orb-wrap"><div class="orb"></div></div>
  <div class="hint" id="hint">選一種呼吸節奏，跟著光慢慢呼吸</div>
  <div class="time" id="time"></div>

  <div class="row">
    <select id="len" aria-label="播放長度">
      <option value="30">30 分鐘</option>
      <option value="60">1 小時</option>
      <option value="90">1.5 小時</option>
      <option value="120">2 小時</option>
      <option value="240">4 小時</option>
      <option value="360">6 小時</option>
      <option value="420" selected>7 小時</option>
      <option value="480">8 小時</option>
    </select>
    <button class="primary" id="play" type="button">開始播放</button>
    <button id="stop" type="button" disabled>結束</button>
  </div>
  <div class="row" style="margin-top:10px">
    <select id="breath" aria-label="呼吸引導">
      <option value="calm" selected>呼吸引導：自然放鬆（吸 5 吐 7）</option>
      <option value="478">呼吸引導：4-7-8 助眠呼吸</option>
      <option value="box">呼吸引導：方塊呼吸（4-4-4-4）</option>
      <option value="off">不要呼吸引導</option>
    </select>
    <select id="story" aria-label="睡前故事">
      <option value="off" selected>不聽睡前故事</option>
      <option value="letgo">先聽一則：放下執念</option>
      <option value="fable">先聽一則：寓言小故事</option>
      <option value="any">先聽一則：隨機故事</option>
    </select>
  </div>
  <div class="hint" id="story-now"></div>

  <div class="presets" role="group" aria-label="音景">
    <button type="button" data-p="default" aria-pressed="true">🌙 預設</button>
    <button type="button" data-p="sea" aria-pressed="false">🌊 海邊</button>
    <button type="button" data-p="rain" aria-pressed="false">🌧 雨夜</button>
    <button type="button" data-p="fire" aria-pressed="false">🔥 營火</button>
    <button type="button" data-p="forest" aria-pressed="false">🌲 森林</button>
    <button type="button" data-p="white" aria-pressed="false">📻 白噪音</button>
  </div>

  <div class="mixer">
    <h2>音量</h2>
    <label>總音量 <input id="v-master" type="range" min="0" max="1" step="0.01" value="0.7"></label>
    <h2>大自然</h2>
    <label>海浪 <input id="v-waves" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <label>雨聲 <input id="v-rain" type="range" min="0" max="1" step="0.01" value="0.3"></label>
    <label>營火 <input id="v-fire" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label>鳥鳴 <input id="v-birds" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label>風聲 <input id="v-wind" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label>白噪音 <input id="v-noise" type="range" min="0" max="1" step="0.01" value="0"></label>
    <h2>音樂</h2>
    <label>和弦 <input id="v-pad" type="range" min="0" max="1" step="0.01" value="0.55"></label>
    <label>鈴聲 <input id="v-bells" type="range" min="0" max="1" step="0.01" value="0.35"></label>
  </div>

  <p class="note">
    可選 <span id="len-range">30 分鐘到 8 小時</span>。音樂會在結尾慢慢淡出（整夜模式只淡出最後 30 分鐘），時間到自動停止。<br>
    部分手機（尤其 iPhone）在螢幕鎖定後會暫停網頁聲音，建議把螢幕亮度調到最低、保持畫面開著，或接上藍牙喇叭。
  </p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // 和弦（MIDI 音高），都落在 C 大調裡，低音區、開放排列，聽起來柔和
  const CHORDS = [
    [48, 55, 64, 71], // Cmaj7
    [45, 52, 60, 67], // Am7
    [41, 48, 57, 64], // Fmaj7
    [43, 50, 57, 62], // G sus
    [40, 47, 55, 62], // Em7
    [38, 45, 53, 60]  // Dm7
  ];
  const BELLS = [72, 74, 76, 79, 81, 84]; // C 大調五聲音階

  const MIX = ["master", "waves", "rain", "fire", "birds", "wind", "noise", "pad", "bells"];
  const PRESETS = {
    default: { waves: .6, rain: .3, fire: 0, birds: 0, wind: 0, noise: 0, pad: .55, bells: .35 },
    sea:     { waves: .75, rain: 0, fire: 0, birds: 0, wind: .2, noise: 0, pad: .45, bells: .3 },
    rain:    { waves: 0, rain: .8, fire: 0, birds: 0, wind: .25, noise: 0, pad: .4, bells: .15 },
    fire:    { waves: 0, rain: 0, fire: .8, birds: 0, wind: .2, noise: 0, pad: .35, bells: .1 },
    forest:  { waves: 0, rain: .1, fire: 0, birds: .5, wind: .45, noise: 0, pad: .35, bells: .2 },
    white:   { waves: 0, rain: 0, fire: 0, birds: 0, wind: 0, noise: .7, pad: 0, bells: 0 }
  };
  // 呼吸節奏：[提示文字, 秒數, 光球大小]
  const BREATH = {
    calm: [["吸氣", 5, 1.12], ["吐氣", 7, .8]],
    "478": [["吸氣", 4, 1.12], ["屏住呼吸", 7, 1.12], ["慢慢吐氣", 8, .8]],
    box: [["吸氣", 4, 1.12], ["屏住", 4, 1.12], ["吐氣", 4, .8], ["停住", 4, .8]]
  };

  let ctx = null, nodes = null, timer = null, breathTimer = null, playing = false;
  let startAt = 0, total = 0, nextChord = 0, nextBell = 0, lastChord = -1;

  // 頭尾各淡入淡出 50 毫秒，循環播放時接縫才不會有「喀」聲
  function loopFade(buf) {
    const n = Math.floor(buf.sampleRate * 0.05);
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) { d[i] *= i / n; d[d.length - 1 - i] *= i / n; }
    }
    return buf;
  }

  function noiseBuffer(type) {
    const len = ctx.sampleRate * 12;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (type === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
        else d[i] = w;
      }
    }
    return loopFade(buf);
  }

  // 營火：低沉的燃燒聲，加上隨機、短促的劈啪聲
  function fireBuffer() {
    const sr = ctx.sampleRate, sec = 30, len = sr * sec;
    const buf = ctx.createBuffer(2, len, sr);
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    let b = 0;
    for (let i = 0; i < len; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; L[i] = R[i] = b * 1.5; }
    let t = 0;
    while (t < sec) {
      t += -Math.log(1 - Math.random()) / 5;
      const start = Math.floor(t * sr);
      const amp = Math.random() < 0.1 ? 0.8 : 0.12 + Math.random() * 0.3;
      const dur = Math.floor(sr * (0.002 + Math.random() * 0.012));
      const pan = Math.random();
      for (let j = 0; j < dur && start + j < len; j++) {
        const v = (Math.random() * 2 - 1) * amp * Math.exp(-j / (dur / 4));
        L[start + j] += v * (1 - pan * 0.6);
        R[start + j] += v * (0.4 + pan * 0.6);
      }
    }
    return loopFade(buf);
  }

  // 鳥鳴：偶爾出現的一串短促、滑音的啁啾聲
  function birdBuffer() {
    const sr = ctx.sampleRate, sec = 60, len = sr * sec;
    const buf = ctx.createBuffer(2, len, sr);
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    let t = 1;
    while (t < sec - 2) {
      const notes = 2 + Math.floor(Math.random() * 5);
      const base = 2200 + Math.random() * 2500;
      const pan = Math.random();
      const amp = 0.06 + Math.random() * 0.1;
      let nt = t;
      for (let n = 0; n < notes; n++) {
        const d = 0.05 + Math.random() * 0.1;
        const f0 = base * (0.9 + Math.random() * 0.3);
        const f1 = f0 * (Math.random() < 0.5 ? 1.25 : 0.8);
        const s = Math.floor(nt * sr), N = Math.floor(d * sr);
        let ph = 0;
        for (let j = 0; j < N && s + j < len; j++) {
          const p = j / N;
          ph += 2 * Math.PI * (f0 + (f1 - f0) * p) / sr;
          const v = Math.sin(ph) * Math.sin(Math.PI * p) * amp;
          L[s + j] += v * (1 - pan);
          R[s + j] += v * pan;
        }
        nt += d + 0.03 + Math.random() * 0.08;
      }
      t = nt + 1.5 + Math.random() * 5;
    }
    return buf;
  }

  function reverbBuffer(seconds) {
    const len = ctx.sampleRate * seconds;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    return buf;
  }

  function build() {
    const user = ctx.createGain();
    const fade = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    user.connect(fade).connect(comp).connect(ctx.destination);

    const reverb = ctx.createConvolver();
    reverb.buffer = reverbBuffer(5);
    const wet = ctx.createGain();
    wet.gain.value = 0.6;
    reverb.connect(wet).connect(user);

    const bus = () => { const g = ctx.createGain(); g.connect(user); return g; };
    const waves = bus(), rain = bus(), pad = bus(), bells = bus();
    const fire = bus(), birds = bus(), wind = bus(), noise = bus();
    pad.connect(reverb);
    bells.connect(reverb);
    birds.connect(reverb);

    // 海浪：低通的布朗噪音，用極慢的 LFO 推拉音量
    const brown = ctx.createBufferSource();
    brown.buffer = noiseBuffer("brown");
    brown.loop = true;
    const waveLp = ctx.createBiquadFilter();
    waveLp.type = "lowpass";
    waveLp.frequency.value = 700;
    const swell = ctx.createGain();
    swell.gain.value = 0.55;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.075;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 0.4;
    lfo.connect(lfoDepth).connect(swell.gain);
    brown.connect(waveLp).connect(swell).connect(waves);

    // 細雨：帶通的白噪音，非常小聲
    const white = ctx.createBufferSource();
    white.buffer = noiseBuffer("white");
    white.loop = true;
    const rainBp = ctx.createBiquadFilter();
    rainBp.type = "bandpass";
    rainBp.frequency.value = 3200;
    rainBp.Q.value = 0.6;
    const rainLevel = ctx.createGain();
    rainLevel.gain.value = 0.12;
    white.connect(rainBp).connect(rainLevel).connect(rain);

    const padLp = ctx.createBiquadFilter();
    padLp.type = "lowpass";
    padLp.frequency.value = 1100;
    padLp.connect(pad);

    // 營火
    const fireSrc = ctx.createBufferSource();
    fireSrc.buffer = fireBuffer();
    fireSrc.loop = true;
    const fireLp = ctx.createBiquadFilter();
    fireLp.type = "lowpass";
    fireLp.frequency.value = 6000;
    const fireLevel = ctx.createGain();
    fireLevel.gain.value = 0.6;
    fireSrc.connect(fireLp).connect(fireLevel).connect(fire);

    // 鳥鳴
    const birdSrc = ctx.createBufferSource();
    birdSrc.buffer = birdBuffer();
    birdSrc.loop = true;
    birdSrc.connect(birds);

    // 風聲：帶通的布朗噪音，中心頻率和音量都緩慢飄動
    const windSrc = ctx.createBufferSource();
    windSrc.buffer = brown.buffer;
    windSrc.loop = true;
    windSrc.playbackRate.value = 0.9;
    const windBp = ctx.createBiquadFilter();
    windBp.type = "bandpass";
    windBp.frequency.value = 450;
    windBp.Q.value = 0.9;
    const windLfo = ctx.createOscillator();
    windLfo.frequency.value = 0.05;
    const windLfoDepth = ctx.createGain();
    windLfoDepth.gain.value = 250;
    windLfo.connect(windLfoDepth).connect(windBp.frequency);
    const gust = ctx.createGain();
    gust.gain.value = 0.7;
    const gustLfo = ctx.createOscillator();
    gustLfo.frequency.value = 0.031;
    const gustDepth = ctx.createGain();
    gustDepth.gain.value = 0.35;
    gustLfo.connect(gustDepth).connect(gust.gain);
    windSrc.connect(windBp).connect(gust).connect(wind);

    // 白噪音：稍微柔化高頻，聽起來比較不刺耳
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = white.buffer;
    noiseSrc.loop = true;
    noiseSrc.loopStart = 5.3;
    const noiseLp = ctx.createBiquadFilter();
    noiseLp.type = "lowpass";
    noiseLp.frequency.value = 3500;
    const noiseLevel = ctx.createGain();
    noiseLevel.gain.value = 0.15;
    noiseSrc.connect(noiseLp).connect(noiseLevel).connect(noise);

    brown.start(); white.start(); lfo.start();
    fireSrc.start(); birdSrc.start(); windSrc.start(); windLfo.start(); gustLfo.start(); noiseSrc.start(0, 5.3);
    nodes = { user, fade, waves, rain, pad, bells, fire, birds, wind, noise, padLp };
    applyMix();
  }

  function applyMix() {
    if (!nodes) return;
    const t = ctx.currentTime;
    const scale = { master: 1, pad: 0.5, bells: 0.5 };
    MIX.forEach(k => {
      const node = k === "master" ? nodes.user : nodes[k];
      node.gain.setTargetAtTime(+$("v-" + k).value * (scale[k] || 1), t, 0.3);
    });
  }

  function setPreset(name) {
    const p = PRESETS[name];
    Object.keys(p).forEach(k => { $("v-" + k).value = p[k]; });
    document.querySelectorAll(".presets button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === name ? "true" : "false"));
    applyMix();
  }

  // 呼吸引導：用 JS 控制光球的放大縮小與提示文字
  function breathe(i) {
    clearTimeout(breathTimer);
    const orb = document.querySelector(".orb");
    const mode = $("breath").value;
    if (!playing || mode === "off") {
      orb.style.transition = "transform 3s ease-in-out, opacity 3s ease-in-out";
      orb.style.transform = "scale(.9)";
      orb.style.opacity = ".5";
      if (playing) $("hint").textContent = "靜靜聽就好";
      return;
    }
    const steps = BREATH[mode];
    const [label, sec, size] = steps[i % steps.length];
    orb.style.transition = `transform ${sec}s ease-in-out, opacity ${sec}s ease-in-out`;
    orb.style.transform = `scale(${size})`;
    orb.style.opacity = size > 1 ? ".85" : ".45";
    $("hint").textContent = `${label}…… ${sec} 秒`;
    breathTimer = setTimeout(() => breathe(i + 1), sec * 1000);
  }

  function playChord(at, dur) {
    let i;
    do { i = Math.floor(Math.random() * CHORDS.length); } while (i === lastChord);
    lastChord = i;
    CHORDS[i].forEach((m, k) => {
      const env = ctx.createGain();
      env.gain.setValueAtTime(0, at);
      env.gain.linearRampToValueAtTime(0.09, at + 6);
      env.gain.setValueAtTime(0.09, at + dur - 8);
      env.gain.linearRampToValueAtTime(0, at + dur);
      const pan = ctx.createStereoPanner();
      pan.pan.value = (k / 3 - 0.5) * 0.8;
      env.connect(pan).connect(nodes.padLp);
      [["sine", 0], ["triangle", 4]].forEach(([type, cents]) => {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = mtof(m);
        o.detune.value = cents;
        o.connect(env);
        o.start(at);
        o.stop(at + dur + 0.1);
      });
    });
  }

  function playBell(at) {
    const f = mtof(BELLS[Math.floor(Math.random() * BELLS.length)]);
    const pan = ctx.createStereoPanner();
    pan.pan.value = Math.random() * 1.4 - 0.7;
    pan.connect(nodes.bells);
    [[1, 0.16, 6], [2.76, 0.04, 2.5]].forEach(([ratio, peak, decay]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = f * ratio;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(peak, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + decay);
      o.connect(g).connect(pan);
      o.start(at);
      o.stop(at + decay + 0.1);
    });
  }

  // 預先排程 90 秒，背景分頁計時器被節流時音樂也不會斷
  function schedule() {
    const horizon = ctx.currentTime + 90;
    const end = startAt + total;
    while (nextChord < horizon && nextChord < end) {
      playChord(nextChord, 24);
      nextChord += 16;
    }
    while (nextBell < horizon && nextBell < end) {
      const progress = (nextBell - startAt) / total;
      playBell(nextBell);
      // 越接近尾聲，鈴聲越稀疏
      nextBell += (7 + Math.random() * 9) * (1 + progress * 1.5);
    }
  }

  function tick() {
    const elapsed = ctx.currentTime - startAt;
    const left = Math.max(0, total - elapsed);
    $("time").textContent = fmt(left);
    if (left <= 0) { stop(true); return; }
    schedule();
  }

  function fmt(s) {
    s = Math.ceil(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }

  function start() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    total = +$("len").value * 60;
    build();
    startAt = ctx.currentTime + 0.1;
    nodes.fade.gain.setValueAtTime(0, startAt);
    nodes.fade.gain.linearRampToValueAtTime(1, startAt + 20);
    // 短時段淡出最後 1/4，長時段（整夜）只淡出最後 30 分鐘
    nodes.fade.gain.setValueAtTime(1, startAt + total - Math.min(total * 0.25, 1800));
    nodes.fade.gain.linearRampToValueAtTime(0, startAt + total);
    nextChord = startAt;
    nextBell = startAt + 10;
    schedule();
    timer = setInterval(tick, 1000);
    setPlaying(true);
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "整夜睡眠音樂", artist: "Courage · My Life and Work" });
    }
    tellStory();
  }

  // 睡前故事：從首頁讀取故事，用裝置內建語音慢慢念，音樂同時在背景播放
  let storyPool = null;
  const hasSpeech = "speechSynthesis" in window;
  if (!hasSpeech) $("story").hidden = true;
  else fetch("index.html").then(r => r.text()).then(html => {
    const doc = new DOMParser().parseFromString(html, "text/html");
    storyPool = [...doc.querySelectorAll(".story")].map(s => ({
      c: s.dataset.c,
      title: s.querySelector("h2").textContent,
      parts: [...s.querySelectorAll("h3, p")].map(e => e.classList.contains("lesson") ? "給今天的你：" + e.textContent : e.textContent)
    }));
  }).catch(() => {});

  function tellStory() {
    const mode = $("story").value;
    if (!hasSpeech || mode === "off") return;
    if (!storyPool) { $("story-now").textContent = "故事還沒載入，這次先只播放音樂。"; return; }
    let pool = mode === "any" ? storyPool : storyPool.filter(s => s.c === mode);
    if (!pool.length) pool = storyPool;
    if (!pool.length) { $("story-now").textContent = "找不到故事，這次先只播放音樂。"; return; }
    const s = pool[Math.floor(Math.random() * pool.length)];
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => /zh[-_]TW/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang));
    const chunks = [s.title, ...s.parts].flatMap(p => p.split(/(?<=[。！？；])/)).map(x => x.trim()).filter(Boolean);
    speechSynthesis.cancel();
    chunks.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      u.lang = "zh-TW";
      if (voice) u.voice = voice;
      u.rate = 0.82;
      u.volume = 0.85;
      if (i === chunks.length - 1) u.onend = u.onerror = () => { $("story-now").textContent = ""; };
      speechSynthesis.speak(u);
    });
    $("story-now").textContent = "📖 正在朗讀：" + s.title;
  }

  function togglePause() {
    if (ctx.state === "running") { ctx.suspend(); if (hasSpeech) speechSynthesis.pause(); setPlaying(false, true); }
    else { ctx.resume(); if (hasSpeech) speechSynthesis.resume(); setPlaying(true); }
  }

  function stop(finished) {
    if (hasSpeech) speechSynthesis.cancel();
    $("story-now").textContent = "";
    clearInterval(timer);
    if (ctx) ctx.close();
    ctx = null; nodes = null;
    setPlaying(false);
    $("play").textContent = "開始播放";
    $("stop").disabled = true;
    $("len").disabled = false;
    $("time").textContent = fmt(+$("len").value * 60);
    $("hint").textContent = finished ? "晚安。明天的你，會比今天更有力量。" : "選一種呼吸節奏，跟著光慢慢呼吸";
  }

  function setPlaying(on, paused) {
    playing = on;
    $("play").textContent = on ? "暫停" : (paused ? "繼續" : "開始播放");
    $("stop").disabled = false;
    $("len").disabled = true;
    breathe(0);
    if (paused) $("hint").textContent = "已暫停";
  }

  $("play").addEventListener("click", () => (ctx ? togglePause() : start()));
  $("stop").addEventListener("click", () => stop(false));
  $("len").addEventListener("change", () => { $("time").textContent = fmt(+$("len").value * 60); });
  $("breath").addEventListener("change", () => breathe(0));
  document.querySelectorAll(".presets button").forEach(b => b.addEventListener("click", () => setPreset(b.dataset.p)));
  document.querySelectorAll(".mixer input").forEach(el => el.addEventListener("input", () => {
    document.querySelectorAll(".presets button").forEach(b => b.setAttribute("aria-pressed", "false"));
    applyMix();
  }));

  // 倒數時間與說明文字都從播放長度選單算出來，改選單時不用另外改這裡
  const lenOpts = $("len").options;
  $("time").textContent = fmt(+$("len").value * 60);
  $("len-range").textContent = `${lenOpts[0].text}到 ${lenOpts[lenOpts.length - 1].text}`;
})();
</script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  }
</script>
</body>
</html>
